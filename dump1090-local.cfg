#
# Local overrides for the bundled Windows dump1090 build.
# This keeps vendor files untouched and lets us prefer Windows geolocation
# instead of prompting through setup.exe on first launch.
#
include = %~dp0\vendor\Dump1090\dump1090.cfg

# Receiver home position is intentionally NOT stored in this committed file.
# Set FLIGHT_TRACKER_HOMEPOS="<lat>,<lon>" (or create an untracked
# dump1090-home.cfg containing "homepos = <lat>,<lon>") and the start
# scripts pass it to the decoder. See README "Receiver home position".
location = no
tui = wincon
console-icon = true
logfile = %~dp0\logs\dump1090.log
web-page = %~dp0\vendor\Dump1090\web_root-Tar1090\index.html
net-bo-port = 30005
